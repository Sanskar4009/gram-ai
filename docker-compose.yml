services:
  postgres:
    image: postgres:16-alpine
    container_name: gramai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gramai}
      POSTGRES_USER: ${DB_USERNAME:-gramai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gramai} -d ${DB_NAME:-gramai}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gramai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gramai-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gramai}
      DB_USERNAME: ${DB_USERNAME:-gramai}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gramai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gramai-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - gramai-network

volumes:
  postgres_data:
    driver: local

networks:
  gramai-network:
    driver: bridge
